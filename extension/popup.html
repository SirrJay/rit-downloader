<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 290px; margin: 0; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; background: #161920; color: #e9ebf1; }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 9px; }
  .head { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
  .head img { width: 24px; height: 24px; }
  .t { color: #9199a8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  button { font: inherit; font-weight: 600; border: 1px solid #2a303b; background: #252a34; color: #e9ebf1; border-radius: 8px; padding: 9px; cursor: pointer; text-align: left; }
  button:hover { border-color: #7c6cff; }
  button.p { background: #7c6cff; border-color: #7c6cff; color: #fff; }
  .off { color: #f0a23b; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img src="icon128.png" alt=""> Rit Downloader</div>
  <div class="t" id="t"></div>
  <div class="off" id="off" hidden>The app isn't running. Open <b>Rit Downloader</b> from your desktop first.</div>
  <button class="p" id="open">Open in app (all videos, choose quality)</button>
  <button id="video">Download video now</button>
  <button id="audio">Download MP3 now</button>
</div>
<script src="popup.js"></script>
</body>
</html>
